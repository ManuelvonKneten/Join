<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts</title>
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/png" />
    <script src="../scripts/auth_guard.js"></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/contacts.css" />
    <link rel="stylesheet" href="../styles/responsive.css" />
    <link rel="stylesheet" href="../styles/responsive_contacts.css" />
  </head>
  <body>
    <div data-include="../templates/sidebar.html"></div>
    <div data-include="../templates/header.html"></div>

    <main class="content">
      <div class="contacts_layout">

        <div class="contacts_left">
          <button class="btn_add_contact" onclick="openAddContact()">
            Add new contact
            <img src="/assets/icons/person.png" alt="" />
          </button>
          <div id="contactList" class="contact_list"></div>
        </div>

        <div class="contacts_right">

          <div class="contacts_right_top">
            <h2 class="contacts_heading">Contacts</h2>
            <div class="contacts_divider_vertical"></div>
            <span class="contacts_subheading">Better with a team</span>
            <button class="btn_back_to_contacts" onclick="closeContactDetail()">
              <img src="/assets/icons/arrow-left.svg" alt="Back" />
            </button>
          </div>

          <div class="contacts_right_bottom hidden">

            <div class="crb_header">
              <div class="crb_avatar">AB</div>
              <div class="crb_name_actions">
                <h3 class="crb_name">Full Name</h3>
                <div class="crb_actions">
                  <button class="crb_btn" onclick="openEditContact(activeContact)">
                    <img src="/assets/icons/edit.png" alt="" /> Edit
                  </button>
                  <button class="crb_btn" onclick="deleteContact()">
                    <img src="/assets/icons/delete.png" alt="" /> Delete
                  </button>
                </div>
              </div>
            </div>

            <div class="crb_info">
              <h4 class="crb_info_heading">Contact Information</h4>
              <div class="crb_info_row">
                <span class="crb_info_label">Email</span>
                <a class="crb_info_email" id="detailEmail" href="#"></a>
              </div>
              <div class="crb_info_row">
                <span class="crb_info_label">Phone</span>
                <span class="crb_info_value" id="detailPhone"></span>
              </div>
            </div>

          </div>

        </div>

      </div>
    </main>

    <div data-include="../templates/bottom_nav.html"></div>

    <div id="addContactOverlay" class="add_contact_overlay hidden" onclick="overlayClose(event)">
      <div class="add_contact_modal">

        <div class="modal_left">
          <img class="modal_logo" src="/assets/img/logo.png" alt="Join Logo" />
          <h2 class="modal_heading">Add contact</h2>
          <p class="modal_sub">Tasks are better with a team!</p>
          <div class="modal_divider"></div>
        </div>

        <div class="modal_right">
          <button class="modal_close_btn" onclick="closeAddContact()">&#x2715;</button>

          <div class="modal_body">

            <div class="modal_avatar_col">
              <div class="modal_avatar">
                <img src="/assets/icons/person.png" alt="" />
              </div>
            </div>

            <form class="modal_form_col" onsubmit="createContact(event)">
              <div class="inputField">
                <input id="contactName" type="text" placeholder="Name" required />
                <img class="inputIcon" src="/assets/icons/person.png" alt="" />
              </div>
              <div class="inputField">
                <input id="contactEmail" type="email" placeholder="Email" required />
                <img class="inputIcon" src="/assets/icons/mail.png" alt="" />
              </div>
              <div class="inputField">
                <input id="contactPhone" type="tel" placeholder="Phone" />
                <img class="inputIcon" src="/assets/icons/phone.png" alt="phone" />

              </div>

              <div class="modal_actions">
                <button type="button" class="btn_modal_cancel" onclick="closeAddContact()">
                  Cancel <span>&#x2715;</span>
                </button>
                <button type="submit" class="btn_modal_create">
                  Create contact <span>&#x2713;</span>
                </button>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>

    <div id="editContactOverlay" class="add_contact_overlay hidden" onclick="overlayEditClose(event)">
      <div class="add_contact_modal">

        <div class="modal_left">
          <img class="modal_logo" src="/assets/img/logo.png" alt="Join Logo" />
          <h2 class="modal_heading">Edit contact</h2>
          <p class="modal_sub">Tasks are better with a team!</p>
          <div class="modal_divider"></div>
        </div>

        <div class="modal_right">
          <button class="modal_close_btn" onclick="closeEditContact()">&#x2715;</button>

          <div class="modal_body">

            <div class="modal_avatar_col">
              <div class="modal_avatar">
                <img src="/assets/icons/person.png" alt="" />
              </div>
            </div>

            <form class="modal_form_col" onsubmit="saveContact(event)">
              <div class="inputField">
                <input id="editContactName" type="text" placeholder="Name" required />
                <img class="inputIcon" src="/assets/icons/person.png" alt="" />
              </div>
              <div class="inputField">
                <input id="editContactEmail" type="email" placeholder="Email" required />
                <img class="inputIcon" src="/assets/icons/mail.png" alt="" />
              </div>
              <div class="inputField">
                <input id="editContactPhone" type="tel" placeholder="Phone" />
                <img class="inputIcon" src="/assets/icons/phone.png" alt="phone" />
              </div>

              <div class="modal_actions">
                <button type="button" class="btn_modal_cancel" onclick="deleteContact()">
                  Delete <span>&#x2715;</span>
                </button>
                <button type="submit" class="btn_modal_create">
                  Save <span>&#x2713;</span>
                </button>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>

    <button class="fab_add_contact" onclick="openAddContact()">
      <img src="/assets/icons/more_vert.png" alt="More options" />
    </button>

    <div id="contactToast" class="contactToast"></div>

    <script src="../scripts/firebase.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../templates/include_html.js"></script>
    <script src="../scripts/contacts.js"></script>
  </body>
</html>
