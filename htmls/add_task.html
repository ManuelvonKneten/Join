<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Task</title>
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/add_task.css" />
  </head>
  <body>
    <div data-include="../templates/sidebar.html"></div>
    <div data-include="../templates/header.html"></div>

    <main class="content">
      <div class="add_task_layout">

        <h1 class="add_task_heading">Add Task</h1>

        <form class="add_task_columns" onsubmit="createTask(event)">

          <div class="add_task_left">
            <div class="add_task_field">
              <label class="add_task_label" for="taskTitle">Title</label>
              <div class="inputField">
                <input id="taskTitle" type="text" placeholder="Enter a title" required />
              </div>
            </div>

            <div class="add_task_field">
              <label class="add_task_label" for="taskDescription">Description</label>
              <textarea id="taskDescription" class="add_task_textarea" placeholder="Enter a description"></textarea>
            </div>

            <div class="add_task_field">
              <label class="add_task_label" for="taskDueDate">Due Date</label>
              <div class="inputField">
                <input id="taskDueDate" type="date" required />
              </div>
            </div>
          </div>

          <div class="add_task_divider"></div>

          <div class="add_task_right">
            <div class="add_task_field">
              <label class="add_task_label">Priority</label>
              <div class="add_task_prio_btns">
                <button class="add_task_prio_btn" type="button" data-priority="urgent">
                  Urgent <img class="prio_icon" src="../assets/icons/urgency.svg" alt="urgent">
                </button>
                <button class="add_task_prio_btn" type="button" data-priority="medium">
                  Medium <img class="prio_icon" src="../assets/icons/medium.svg" alt="medium">
                </button>
                <button class="add_task_prio_btn" type="button" data-priority="low">
                  Low <img class="prio_icon" src="../assets/icons/low.svg" alt="low">
                </button>
              </div>
            </div>

            <div class="add_task_field">
              <label class="add_task_label" for="taskAssigned">Assigned to</label>
              <select id="taskAssigned" class="add_task_select">
                <option value="">Select contacts to assign</option>
              </select>
            </div>

            <div class="add_task_field">
              <label class="add_task_label" for="taskCategory">Category</label>
              <select id="taskCategory" class="add_task_select">
                <option value="">Select task category</option>
                <option value="technical">Technical Task</option>
                <option value="user_story">User Story</option>
              </select>
            </div>

            <div class="add_task_field">
              <label class="add_task_label" for="subtaskInput">Subtasks</label>
              <div class="inputField">
                <input id="subtaskInput" type="text" placeholder="Add new subtask" />
                <img id="addSubtaskIcon" class="inputIcon" src="/assets/icons/add_plus_black.svg" alt="add" />
              </div>
              <ul id="subtaskList" class="add_task_subtask_list"></ul>
            </div>

            <div class="add_task_actions">
              <button type="button" class="add_task_btn add_task_btn_clear">Clear <span>&#x2715;</span></button>
              <button type="submit" class="add_task_btn add_task_btn_create">Create Task <span>&#x2713;</span></button>
            </div>
          </div>

        </form>

      </div>
    </main>

    <div id="addTaskToast" class="add_task_toast"></div>

    <script src="../scripts/firebase.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../templates/include_html.js"></script>
    <script src="../scripts/add_task.js"></script>
  </body>
</html>
