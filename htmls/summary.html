<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOIN - Summary</title>
    <script src="../scripts/auth_guard.js"></script>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/header_nav.css" />
    <link rel="stylesheet" href="../styles/bottom_nav.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
  </head>
  <body>
    <div data-include="../templates/sidebar.html"></div>
    <div data-include="../templates/header.html"></div>

    <main class="content">
      <section class="summary_page">
        <div class="summary_headline">
          <h1>Join 360</h1>
          <p>Key Metrics at a Glance</p>
          <div class="seperating_line" aria-hidden="true"></div>
        </div>

        <div class="summary_body">
          <div class="summary_overview">
            <a href="./board.html" class="summary_card summary_card_top" aria-label="Total To-Do tasks">
              <div class="summary_card_content">
                <div class="summary_icon summary_icon_pencil" aria-hidden="true"></div>
                <div class="summary_card_text">
                  <span id="summary_todo_amount" class="summary_number">0</span>
                  <span class="summary_label">To-Do</span>
                </div>
              </div>
            </a>

            <a href="./board.html" class="summary_card summary_card_top" aria-label="Total completed tasks">
              <div class="summary_card_content">
                <div class="summary_icon summary_icon_check" aria-hidden="true"></div>
                <div class="summary_card_text">
                  <span id="summary_done_amount" class="summary_number">0</span>
                  <span class="summary_label">Done</span>
                </div>
              </div>
            </a>

            <a href="./board.html" class="summary_card summary_card_urgent" aria-label="Urgent tasks with upcoming deadline">
              <div class="summary_card_content">
                <img src="../assets/icons/urgency.svg" alt="Urgency alert icon" />
                <div class="summary_card_text">
                  <span id="summary_urgent_amount" class="summary_number">0</span>
                  <span class="summary_label">Urgent</span>
                </div>
              </div>

              <div class="summary_deadline_box">
                <strong id="summary_deadline" aria-label="Next urgent deadline"></strong>
                <span>Upcoming Deadline</span>
              </div>
            </a>

            <a href="./board.html" class="summary_card" aria-label="Total tasks in board">
              <span id="summary_board_amount" class="summary_number">0</span>
              <span class="summary_label">Tasks in Board</span>
            </a>

            <a href="./board.html" class="summary_card" aria-label="Tasks currently in progress">
              <span id="summary_progress_amount" class="summary_number">0</span>
              <span class="summary_label">Tasks in Progress</span>
            </a>

            <a href="./board.html" class="summary_card" aria-label="Tasks awaiting feedback">
              <span id="summary_feedback_amount" class="summary_number">0</span>
              <span class="summary_label">Awaiting Feedback</span>
            </a>
          </div>

          <aside class="summary_greeting_box" role="complementary" aria-label="User greeting">
            <h2 id="summary_greeting">Good morning,</h2>
            <p id="summary_user_name">Guest</p>
          </aside>
        </div>
      </section>
    </main>

    <div data-include="../templates/bottom_nav.html"></div>

    <script src="../scripts/utils.js"></script>
    <script src="../scripts/firebase.js"></script>
    <script src="../templates/include_html.js"></script>
    <script src="../scripts/summary.js"></script>
  </body>
</html>
