<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join – Sign up</title>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/png" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body class="logIn">

    <div class="loginPageWrapper">
        <header class="logInHeader fadeHeader">
            <img class="logInLogo" src="../assets/img/logo_dark.png" alt="Join Logo">

        </header>

        <main class="logInMain fadeMain">
            <div class="logInBox">

                <a href="../index.html" class="backArrow" aria-label="Back to login">
                    <img src="../assets/icons/arrow-left.svg" alt="">
                </a>

                <h1>Sign up</h1>

                <form action="#" novalidate>

                    <div class="inputField">
                        <input
                            id="signupName"
                            type="text"
                            name="name"
                            placeholder="Name"
                            aria-label="Name"
                        >
                        <img class="inputIcon" src="../assets/icons/person.png" alt="" aria-hidden="true">
                    </div>
                    <span id="nameError" class="inputError">Please enter letters only</span>

                    <div class="inputField">
                        <input
                            id="signupEmail"
                            type="email"
                            name="email"
                            placeholder="Email"
                            aria-label="Email"
                        >
                        <img class="inputIcon" src="../assets/icons/mail.png" alt="" aria-hidden="true">
                    </div>

                    <div class="inputField">
                        <input
                            id="signupPassword"
                            type="password"
                            name="password"
                            placeholder="Password"
                            aria-label="Password"
                        >
                        <img
                            id="signupPasswordToggle"
                            class="inputIcon passwordToggle"
                            src="../assets/icons/lock.png"
                            alt="Toggle password visibility"
                            role="button"
                            tabindex="0"
                        >
                    </div>

                    <div class="inputField">
                        <input
                            id="signupConfirmPassword"
                            type="password"
                            name="confirmPassword"
                            placeholder="Confirm Password"
                            aria-label="Confirm Password"
                        >
                        <img
                            id="signupConfirmPasswordToggle"
                            class="inputIcon passwordToggle"
                            src="../assets/icons/lock.png"
                            alt="Toggle password visibility"
                            role="button"
                            tabindex="0"
                        >
                    </div>
                    <span id="passwordMismatch" class="inputError">Your passwords don't match. Please try again</span>

                    <label class="signupCheckboxLabel">
                        <input
                            id="signupAccept"
                            type="checkbox"
                        >
                        I accept the <a href="../htmls/privacy_policy.html">Privacy Policy</a>
                    </label>

                    <div class="loginButtons signupButtons">
                        <button id="signupBtn" class="logInBtn" type="submit" disabled>Sign up</button>
                    </div>

                </form>

            </div>
        </main>

        <footer class="logInFooter fadeFooter">
            <a href="../htmls/privacy_policy.html">Privacy Policy</a>
            <a href="../htmls/legal_notice.html">Legal Notice</a>
        </footer>
    </div>

    <div id="signupToast" class="signupToast" role="status" aria-live="polite" aria-atomic="true">You Signed Up successfully</div>

    <div class="landscape_blocker">
        <p>Please rotate your device.</p>
    </div>

    <!-- defer ist nötig: register.js greift beim Laden direkt auf DOM-Elemente zu (getElementById etc.) -->
    <script src="../scripts/firebase.js" defer></script>
    <script src="../scripts/register.js" defer></script>

</body>
</html>
