<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join – Sign up</title>
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body class="logIn">

    <header class="logInHeader fadeHeader">
        <img class="logInLogo" src="/assets/img/logo_dark.png" alt="Join Logo">

    </header>

    <main class="logInMain fadeMain">
        <div class="logInBox">

            <h2>Sign up</h2>

            <form action="#">

                <div class="inputField">
                    <input
                        id="signupName"
                        type="text"
                        name="name"
                        placeholder="Name"
                        required
                    >
                    <img class="inputIcon" src="/assets/icons/person.png" alt="">
                </div>

                <div class="inputField">
                    <input
                        id="signupEmail"
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                    >
                    <img class="inputIcon" src="/assets/icons/mail.png" alt="">
                </div>

                <div class="inputField">
                    <input
                        id="signupPassword"
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                    >
                    <img class="inputIcon" src="/assets/icons/lock.png" alt="">
                </div>

                <div class="inputField">
                    <input
                        id="signupConfirmPassword"
                        type="password"
                        name="confirmPassword"
                        placeholder="Confirm Password"
                        required
                    >
                    <img class="inputIcon" src="/assets/icons/lock.png" alt="">
                </div>
                <span id="passwordMismatch" class="passwordMismatch">Passwords do not match.</span>

                <label class="signupCheckboxLabel">
                    <input
                        id="signupAccept"
                        type="checkbox"
                    >
                    I accept the <a href="/htmls/privacy_policy.html">Privacy Policy</a>
                </label>

                <div class="loginButtons signupButtons">
                    <button id="signupBtn" class="logInBtn" type="submit" disabled>Sign up</button>
                </div>

            </form>

        </div>
    </main>

    <footer class="logInFooter fadeFooter">
        <a href="/htmls/privacy_policy.html">Privacy Policy</a>
        <a href="/htmls/legal_notice.html">Legal Notice</a>
    </footer>

    <div id="signupToast" class="signupToast">You Signed Up successfully</div>

    <script src="../scripts/register.js" defer></script> // hier defer ist nicht notwendig oder?

</body>
</html>
