<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board</title>
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/png" />
    <link rel="stylesheet" href="../styles/board.css">
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
  </head>
  <body>
    <div data-include="../templates/sidebar.html"></div>
    <div data-include="../templates/header.html"></div>

    <main class="content">

      <section id="board" class="board">
        <div class="titel_and_search">
          <h2>Board</h2>
          <div class="search">
            <div class="search_field">
              <input type="text" id="search" placeholder="Find Task">
              <div class="search_icon" id="search_icon">
                <img src="../assets/icons/search.svg" alt=""> 
              </div>
            </div>
              
            <button>
              Add task
              <img src="../assets/icons/add_plus.svg" alt="plus icos">
            </button>
          </div>

        </div>

        <div class="task_steps">

          <div  id="toDo" class="to_do">
            <div class="task_column">
              <h3>To do</h3>
              <button><img src="../assets/icons/add_plus_black.svg" alt="plus icon" ></button>
            </div>
              <div class="task_field">
                  <div id="card" class="card">
                    <button>Platzhalter</button>
                    <h4>Platzhalter Titel</h4>
                    <p>Platzhalter text bla bananna <br> so banana awit</p>
                    <div class="progress_container">
                      <div class="progress_bar">
                        <div class="progress"></div>
                      </div>
                      <span>x/2 Subtasks</span>
                    </div>
                 </div>
            </div>
          </div>

          <div  id="InProgress" class="in_progress">
            <div class="task_column">
              <h3>In progress</h3>
              <button><img src="../assets/icons/add_plus_black.svg" alt="plus icon" ></button>
            </div>
            <div class="task_field"></div>
          </div>

          <div  id="awaitFeedback" class="await_feedback">
            <div class="task_column">
              <h3>Await feedback</h3>
              <button><img src="../assets/icons/add_plus_black.svg" alt="plus icon" ></button>
            </div>
            <div class="task_field"></div>
          </div>

          <div  id="done" class="done">
            <div class="task_column">
              <h3>Done</h3>
            </div>
            <div class="task_field"></div>
          </div>

        </div>  
        
      </section>

 


    </main>

    <script src="../templates/board_html.js"></script>
    <script src="../scripts/board.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../templates/include_html.js"></script>
    <script src="../scripts/summary.js"></script>
  </body>
</html>
