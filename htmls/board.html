<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board</title>
    <script src="../scripts/auth_guard.js"></script>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/header_nav.css" />
    <link rel="stylesheet" href="../styles/bottom_nav.css" />
    <link rel="stylesheet" href="../styles/contacts.css" />
    <link rel="stylesheet" href="../styles/contacts_list.css" />
    <link rel="stylesheet" href="../styles/contacts_modal.css" />
    <link rel="stylesheet" href="../styles/add_task.css" />
    <link rel="stylesheet" href="../styles/add_task_subtasks.css" />
    <link rel="stylesheet" href="../styles/assigned_dropdown.css" />
    <link rel="stylesheet" href="../styles/toast.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/board_dialog.css" />
    <link rel="stylesheet" href="../styles/board.css" />
  </head>

  <body>
    <div data-include="../templates/sidebar.html"></div>
    <div data-include="../templates/header.html"></div>

    <main class="content">
      
      <dialog id="delete_task" class="delete_task">
        <h2>Delete Task?</h2>
        <p>Are you sure you want to delete this task?</p>

        <div class="delete_buttons">
          <button onclick="closeDeleteTask()">Cancel</button>
          <button onclick="deleteTask()">Delete</button>
        </div>
      </dialog>

      <dialog class="dialogTask" id="dialogTask"></dialog>

      <dialog id="dialog_add_task_board"></dialog>

      <section id="board" class="board">
        <div class="titel_and_search">
          <div class="header_mobile_flex">
            <h1>Board</h1>
            <button
              class="header_mobile_board"
              aria-label="Add task"
              onclick="openAddTaskPopUp()"
            >
              <img
                src="../assets/icons/add_plus.svg"
                alt=""
              />
            </button>
          </div>
          <div class="search_container">
            <div class="search">
              <div class="search_field">
                <input type="text" id="search" placeholder="Find Task" />
                <div class="search_icon" id="search_icon">
                  <img src="../assets/icons/search.svg" alt="" />
                </div>
              </div>

              <button onclick="openAddTaskPopUp()">
                Add task
                <img src="../assets/icons/add_plus.svg" alt="plus icos" />
              </button>
            </div>
            <span id="no_results_alert"></span>
          </div>
        </div>

        <div class="task_steps">
          <div id="toDo" class="to_do">
            <div class="task_column">
              <h3>To do</h3>
              <button onclick="openAddTaskPopUp('todo')">+</button>
            </div>
            <div
              id="toDoField"
              data-status="todo"
              ondrop="moveTo(event)"
              ondragover="
                allowDrop(event);
                highlight('toDoField');
              "
              ondragleave="removeHighlight('toDoField')"
              class="task_field"
            ></div>
          </div>

          <div id="InProgress" class="in_progress">
            <div class="task_column">
              <h3>In progress</h3>
              <button onclick="openAddTaskPopUp('inprogress')">+</button>
            </div>
            <div
              id="inProgressField"
              data-status="inprogress"
              ondrop="moveTo(event)"
              ondragover="
                allowDrop(event);
                highlight('inProgressField');
              "
              ondragleave="removeHighlight('inProgressField')"
              class="task_field"
            ></div>
          </div>

          <div id="awaitFeedback" class="await_feedback">
            <div class="task_column">
              <h3>Await feedback</h3>

              <button
                class="aw_btn_wrap"
                onclick="openAddTaskPopUp('awaitfeedback')"
              >
                +
              </button>
            </div>
            <div
              id="awaitFeedbackField"
              data-status="awaitfeedback"
              ondrop="moveTo(event)"
              ondragover="
                allowDrop(event);
                highlight('awaitFeedbackField');
              "
              ondragleave="removeHighlight('awaitFeedbackField')"
              class="task_field"
            ></div>
          </div>

          <div id="done" class="done">
            <div class="task_column">
              <h3>Done</h3>
            </div>
            <div
              id="doneField"
              data-status="done"
              ondrop="moveTo(event)"
              ondragover="
                allowDrop(event);
                highlight('doneField');
              "
              ondragleave="removeHighlight('doneField')"
              class="task_field"
            ></div>
          </div>
        </div>
      </section>
    </main>

    <div
      id="addTaskToast"
      class="add_task_toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <div
      id="contactToast"
      class="contactToast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <div data-include="../templates/bottom_nav.html"></div>

    <script src="../scripts/firebase.js"></script>

    <script src="../templates/template.js"></script>
    <script src="../templates/board_html.js"></script>

    <script src="../scripts/utils.js"></script>
    <script src="../scripts/current_user_contact.js"></script>
    <script src="../scripts/add_task_widgets.js"></script>
    <script src="../scripts/add_task_date.js"></script>
    <script src="../scripts/add_task_form.js"></script>
    <script src="../scripts/add_task.js"></script>

    <script src="../scripts/board_utils.js"></script>
    <script src="../scripts/board_edit.js"></script>
    <script src="../scripts/board_dialogs.js"></script>
    <script src="../scripts/board.js"></script>
    <script src="../templates/include_html.js"></script>
  </body>
</html>
