<header class="header_main">
  <a class="header_mobile" href="../index.html" onclick="clearLocalStorage()"><img src="../assets/img/logo_dark.png" alt="Back to Login"></a>

  <p class="header_main_title">Kanban Project Management Tool</p>

  <div class="header_main_user_area">
    <a class="header_main_help_link" href="../htmls/help.html" aria-label="Help" data-auth-required="true">?</a>

    <button
      id="userInitialsBtn"
      class="header_main_user_button"
      type="button"
      aria-label="User menu"
      aria-expanded="false"
      data-auth-required="true"
      onclick="toggleUserDropdown(event)">

    <div id="user_dropdown" class="user_dropdown d_none" data-auth-required="true" onclick="event.stopPropagation()">
      <a class="user_dropdown_mobile_help" href="../htmls/help.html" aria-label="Help">Help</a>
      <a href="../htmls/legal_notice.html" onclick="openUserDropdownContent('./legal_notice.html', 'legal_notice.html'); return false;">Legal Notice</a>
      <a href="../htmls/privacy_policy.html" onclick="openUserDropdownContent('./privacy_policy.html', 'privacy_policy.html'); return false;">Privacy Policy</a>

  </div>

  <p>Please rotate your device.</p>
</div>
