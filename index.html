<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Header (1440 × 96)</h1>
</header>

<div class="sidebarLeft">

    <aside class="sidebar">

        <div class="sidebar_logo">
            <img src="./assets/img/logo.png" alt="logo">
        </div>

        <nav>
            <a class="nav_item" href="#">
                <img class="icon_default" src="./assets/icons/summary.png" alt="Summary">
                <img class="icon_hover" src="./assets/icons/summaryHover.png" alt="">
            </a>

            <a class="nav_item" href="#">
                <img class="icon_default" src="./assets/icons/addTask.png" alt="Add Task">
                <img class="icon_hover" src="./assets/icons/addTaskHover.png" alt="">
            </a>

            <a class="nav_item" href="#">
                <img class="icon_default" src="./assets/icons/board.png" alt="Board">
                <img class="icon_hover" src="./assets/icons/boardHover.png" alt="">
            </a>

            <a class="nav_item" href="#">
                <img class="icon_default" src="./assets/icons/contacts.png" alt="Contacts">
                <img class="icon_hover" src="./assets/icons/contactsHover.png" alt="">
            </a>
        </nav>

</aside>

    <main class="content">
        <h2>Content</h2>
        <p>Hier kommt der Inhalt hin.</p>
    </main>

</div>

</body>
</html>
